# After a release is published, download its files anonymously (exactly as a
# player's launcher does) and check them against latest.json. Read-only.
name: Verify release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to check (empty: the latest stable release)"
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check published files
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 scripts/verify_release.py "$GITHUB_REPOSITORY" "$TAG"
